[project]
name = "agenda360-backend"
version = "0.1.0"
description = "API multi-tenant do Agenda360 (MVP — Carioca Barbearia)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",  # só para Alembic (sync, permite DDL multi-statement)
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# app/core/db.py cria o engine async uma vez, no import — precisa do mesmo
# event loop durante toda a sessão de testes, senão asyncpg quebra com
# "attached to a different loop" ao reusar esse engine entre testes.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
